function DonutChart({data,currency}){

        React.createElement('div',{style:{width:12,height:12,borderRadius:3,background:s.color,flexShrink:0}}),
        React.createElement('span',{style:{fontSize:16}},s.emoji),

        React.createElement('div',{style:{fontSize:12,color:C.muted,minWidth:30,textAlign:"right",fontWeight:600}},`${s.pct}%`)

        ?React.createElement(Btn,{onClick:()=>setDanger(true),style:{width:"100%",padding:"13px",borderRadius:12,background:"transparent",border:`1.5px solid ${C.red}`,color:C.red,fontSize:14,fontWeight:800}},"Eliminar todos los registros")
        :React.createElement('div',null,
            React.createElement('div',{style:{color:C.muted,fontSize:14,marginBottom:12,fontWeight:600}},"¿Estás seguro? Esta acción no se puede deshacer."),
            React.createElement('div',{style:{display:"flex",gap:8}},
              React.createElement(Btn,{onClick:()=>setDanger(false),style:{flex:1,padding:"12px",borderRadius:12,background:C.card2,border:`1px solid ${C.border}`,color:C.muted,fontSize:14,fontWeight:700}},"Cancelar"),
              React.createElement(Btn,{onClick:()=>{onClearAll();setDanger(false);},style:{flex:1,padding:"12px",borderRadius:12,background:C.red,color:"#fff",fontSize:14,fontWeight:800}},"Eliminar todo")
            )
          )
    )
  );
}
function BottomNav({tab,setTab}){
  const tabs=[{id:"add",label:"Nuevo",icon:"✚",color:C.accent},{id:"movs",label:"Movim.",icon:"≋",color:C.gasto},{id:"tarjetas",label:"Tarjetas",icon:"◈",color:C.tarjeta},{id:"resumen",label:"Resumen",icon:"◎",color:C.blue},{id:"config",label:"Config",icon:"⚙",color:C.muted}];
  return React.createElement('div',{style:{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.card,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom)",boxShadow:"0 -4px 24px rgba(100,80,210,0.13)"}},
    tabs.map(t=>React.createElement(Btn,{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:"12px 0",background:"none",flexDirection:"column",gap:4,color:tab===t.id?t.color:C.dim,transition:"color 0.15s"}},
      React.createElement('span',{style:{fontSize:17,lineHeight:1}},t.icon),
      React.createElement('span',{style:{fontSize:10,fontWeight:800,letterSpacing:"0.04em",fontFamily:"'Nunito',sans-serif"}},t.label)
    ))
  );
}
function App(){
  const [tab,setTab]=useState("add");
  const [expenses,setExpenses]=useState([]);
  const [incomes,setIncomes]=useState([]);
  const [cardPurchases,setCardPurchases]=useState([]);
  const [transfers,setTransfers]=useState([]);
  const [accounts,setAccounts]=useState(DEFAULT_ACCOUNTS);
  const [expCats,setExpCats]=useState(DEFAULT_EXP_CATS);
  const [incCats,setIncCats]=useState(DEFAULT_INC_CATS);
  const [cardList,setCardList]=useState(DEFAULT_CARDS);
  const [loaded,setLoaded]=useState(false);

  useEffect(()=>{
    // Load from localStorage
    const e=lsGet(SK.expenses),i=lsGet(SK.incomes),cp=lsGet(SK.cardPurchases),tr=lsGet(SK.transfers);
    const a=lsGet(SK.accounts),ec=lsGet(SK.expCats),ic=lsGet(SK.incCats),cl=lsGet(SK.cardList);
    if(e) setExpenses(e);
    if(i) setIncomes(i);
    if(cp) setCardPurchases(cp);
    if(tr) setTransfers(tr);
    if(a) setAccounts(a);
    if(ec) setExpCats(migCats(ec));
    if(ic) setIncCats(migCats(ic));
    if(cl) setCardList(cl);
    setLoaded(true);
  },[]);

  const save=(k,v)=>{if(!loaded)return;lsSet(k,v);};
  useEffect(()=>save(SK.expenses,expenses),[expenses,loaded]);
  useEffect(()=>save(SK.incomes,incomes),[incomes,loaded]);
  useEffect(()=>save(SK.cardPurchases,cardPurchases),[cardPurchases,loaded]);
  useEffect(()=>save(SK.transfers,transfers),[transfers,loaded]);
  useEffect(()=>save(SK.accounts,accounts),[accounts,loaded]);
  useEffect(()=>save(SK.expCats,expCats),[expCats,loaded]);
  useEffect(()=>save(SK.incCats,incCats),[incCats,loaded]);
  useEffect(()=>save(SK.cardList,cardList),[cardList,loaded]);

  const addTo=setter=>item=>setter(p=>[{...item,id:uid()},...p]);
  return React.createElement('div',{style:{background:C.bg,minHeight:"100vh",fontFamily:"'Nunito',sans-serif",color:C.text,maxWidth:480,margin:"0 auto",paddingBottom:80}},
    tab==="add"&&React.createElement(AddTab,{onAddExpense:addTo(setExpenses),onAddIncome:addTo(setIncomes),onAddCard:addTo(setCardPurchases),onAddTransfer:addTo(setTransfers),accounts,expCats,incCats,cardList}),
    tab==="movs"&&React.createElement(MovimientosTab,{expenses,incomes,transfers,expCats,incCats,onDeleteExpense:id=>setExpenses(p=>p.filter(e=>e.id!==id)),onDeleteIncome:id=>setIncomes(p=>p.filter(e=>e.id!==id)),onDeleteTransfer:id=>setTransfers(p=>p.filter(e=>e.id!==id))}),
    tab==="tarjetas"&&React.createElement(TarjetasTab,{cardPurchases,onDelete:id=>setCardPurchases(p=>p.filter(e=>e.id!==id)),cardList,expCats}),
    tab==="resumen"&&React.createElement(ResumenTab,{expenses,incomes,cardPurchases,expCats,incCats}),
    tab==="config"&&React.createElement(ConfigTab,{accounts,setAccounts,expCats,setExpCats,incCats,setIncCats,cardList,setCardList,onClearAll:()=>{setExpenses([]);setIncomes([]);setCardPurchases([]);setTransfers([]);}}),
    React.createElement(BottomNav,{tab,setTab})
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
